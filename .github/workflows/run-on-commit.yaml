name: Run on commit
on:
  push:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # xwfb-run runs X11 clients on Xwayland inside a headless Wayland compositor (weston).
      # Unlike Xvfb, Xwayland can expose sRGB-capable GLX configs, which OPENRNDR's SDL backend requires.
      - name: Install virtual display and Mesa
        run: |
          sudo apt-get update
          sudo apt-get install -y xwayland-run weston mesa-utils libgl1-mesa-dri libegl1

      - name: Print OpenGL info
        # -t prints the visual/fbconfig tables; check the "s rgb" column for sRGB-capable configs
        run: |
          xwfb-run --help || true
          ls -l /dev/dri || echo "no /dev/dri"
          xwfb-run -c weston -- glxinfo -B
          xwfb-run -c weston -- glxinfo -t

      - name: Compile
        run: ./gradlew classes

      # The program itself takes about a second; the rest is Gradle's up-to-date checks.
      # SDL_VIDEO_DRIVER=x11 keeps SDL on the GLX path instead of talking to weston directly.
      - name: Run program
        env:
          SDL_VIDEO_DRIVER: x11
        run: xwfb-run -c weston -- timeout 30s ./gradlew run --stacktrace

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: screenshot.png
          if-no-files-found: warn
